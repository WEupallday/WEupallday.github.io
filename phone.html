<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TheFlap phone</title>
<style>
  html,body{margin:0;height:100%;}
  body{background:radial-gradient(circle at 50% 20%,#2b3670,#141a34 75%);display:flex;align-items:center;justify-content:center;}
  .phone{position:relative;width:376px;height:812px;background:#080808;border-radius:52px;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 2px #2a2a2a,inset 0 0 0 2px #000;}
  .screen{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:#2a3480;}
  .screen iframe{width:100%;height:100%;border:0;display:block;}
  .island{position:absolute;top:15px;left:50%;transform:translateX(-50%);width:108px;height:26px;background:#000;border-radius:16px;z-index:9;pointer-events:none;}
</style></head><body>
  <div class="phone"><div class="island"></div><div class="screen"><iframe id="f" title="TheFlap"></iframe></div></div>
  <script>document.getElementById('f').src='preview.html?app=1&hdr=x&safe=40&t='+Date.now();</script>
</body></html>
