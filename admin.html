<style>

  *{box-sizing:border-box;}
  body{margin:0;background:#0d1a2e;color:#e8eef7;font-family:-apple-system,Segoe UI,Verdana,Arial,sans-serif;font-size:14px;line-height:1.4;}
  a{color:#7fd0ff;}
  /* ---- login gate ---- */
  #gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .gatebox{width:100%;max-width:360px;background:#152a4a;border:1px solid #24406e;border-radius:14px;padding:26px 24px;box-shadow:0 12px 40px rgba(0,0,0,.5);}
  .gatebox h1{font-size:20px;margin:0 0 4px;color:#fff;}
  .gatebox .sub{font-size:12px;color:#9db4d6;margin-bottom:18px;}
  .gatebox label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#9db4d6;margin:12px 0 5px;}
  .gatebox input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid #2c4a7a;background:#0f2440;color:#fff;font-size:15px;}
  .gatebox button{width:100%;margin-top:18px;padding:12px;border:none;border-radius:9px;background:linear-gradient(180deg,var(--blue),var(--blue-d));color:#fff;font-weight:bold;font-size:15px;cursor:pointer;}
  .gatebox button:hover{filter:brightness(1.08);}
  .gate-err{color:#ff8a7a;font-size:12px;margin-top:12px;min-height:16px;}
  /* ---- app shell ---- */
  #app{display:none;max-width:1080px;margin:0 auto;padding:0 0 60px;}
  header.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#16305a,#0d1f3d);border-bottom:1px solid #24406e;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  header.topbar .crown{font-size:20px;}
  header.topbar h1{font-size:16px;margin:0;color:#fff;}
  header.topbar .who{font-size:11px;color:#9db4d6;margin-left:auto;}
  header.topbar button.hbtn{background:#24406e;border:none;color:#cfe0f6;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:bold;cursor:pointer;}
  header.topbar button.hbtn:hover{background:#2e5290;}
  /* compact stat strip */
  .statstrip{display:flex;flex-wrap:wrap;gap:8px 16px;background:#0f2340;border-bottom:1px solid #22406e;padding:9px 16px;position:sticky;top:47px;z-index:19;}
  .statstrip .s{font-size:12px;color:#9db4d6;white-space:nowrap;}
  .statstrip .s b{color:#fff;font-size:14px;}
  .statstrip .s.hot b{color:var(--gold);}
  .statstrip .s.danger b{color:#ff9a86;}
  /* sticky tab nav */
  nav.tabs{position:sticky;top:83px;z-index:18;display:flex;gap:6px;flex-wrap:wrap;background:#0d1f3d;border-bottom:1px solid #24406e;padding:8px 12px;}
  nav.tabs button{background:#152a4a;border:1px solid #24406e;color:#bcd0ee;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:bold;cursor:pointer;}
  nav.tabs button:hover{background:#1d3career;background:#1d385f;}
  nav.tabs button.on{background:linear-gradient(180deg,var(--blue),var(--blue-d));color:#fff;border-color:#3b7fd0;}
  .badgecard{background:#0c1836;border:1.5px solid #2f5aa0;border-radius:10px;padding:12px;margin:10px 0;}
  .badgecard .bc-h{display:flex;align-items:center;gap:9px;}
  .badgecard .bc-ic{font-size:22px;}
  .badgecard .bc-h b{font-size:15px;color:#fff;flex:1;}
  .badgecard .bc-del{padding:5px 10px;font-size:12px;}
  .badgecard .bc-desc{font-size:12.5px;color:#a9c2e8;margin:6px 0 8px;}
  .badgecard .bc-grant{display:flex;gap:8px;align-items:center;}
  .badgecard .bc-inp{margin:0;flex:1;}
  .badgecard .bc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .badgecard .gchip{background:#183a6e;border:1px solid #3f7ad0;border-radius:12px;padding:3px 8px;font-size:12px;color:#cfe2ff;display:inline-flex;align-items:center;gap:7px;}
  .badgecard .gchip span{cursor:pointer;color:#ff9db4;font-weight:bold;}
  .status{display:inline-block;font-size:10px;font-weight:bold;padding:2px 8px;border-radius:9px;margin-left:6px;}
  .st-active{background:#123d1a;color:#7dffa0;border:1px solid #1a8a1a;}
  .st-ended{background:#3a1830;color:#ff9db4;border:1px solid #a3164e;}
  .st-hidden{background:#26324a;color:#a9c2e8;border:1px solid #46608e;}
  /* section container */
  .wrap{padding:16px;}
  .sec{background:#132747;border:1px solid #22406e;border-radius:14px;padding:16px;margin-bottom:16px;}
  .sec > h2{margin:0 0 12px;font-size:15px;color:#fff;display:flex;align-items:center;gap:8px;border-bottom:1px solid #22406e;padding-bottom:9px;}
  .sec .refresh{margin-left:auto;font-size:11px;font-weight:normal;background:#24406e;border:none;color:#cfe0f6;border-radius:7px;padding:5px 10px;cursor:pointer;}
  .subhead{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#7f9bc4;margin:16px 0 8px;font-weight:bold;}
  .subhead:first-child{margin-top:0;}
  /* stat cards (Stats tab) */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
  .stat{background:#0f2340;border:1px solid #23406e;border-radius:11px;padding:14px 12px;text-align:center;}
  .stat b{display:block;font-size:26px;color:#fff;line-height:1;}
  .stat span{display:block;font-size:11px;color:#9db4d6;margin-top:6px;}
  .stat.hot b{color:var(--gold);} .stat.danger b{color:#ff9a86;}

  .row{background:#0f2340;border:1px solid #23406e;border-radius:10px;padding:11px 13px;margin-bottom:9px;}
  .row .r-top{font-weight:bold;color:#fff;}
  .row .r-meta{font-size:11px;color:#8ba3c9;margin-top:2px;}
  .row .r-body{margin:6px 0;color:#d5e2f5;word-break:break-word;}
  .row.appeal{border-color:#8a5a1a;background:#241c0c;}
  .row.reportrow{border-color:#7a2a1a;}
  .acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
  .btn{border:none;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:bold;cursor:pointer;color:#fff;background:#24406e;}

  .btn.del{background:linear-gradient(180deg,#c0603a,#8f3c1c);}
  .btn.red{background:linear-gradient(180deg,#d0453a,#9f2a1c);}
  .btn.green{background:linear-gradient(180deg,#2f9e5a,#1c7a42);}
  .btn.blue{background:linear-gradient(180deg,var(--blue),var(--blue-d));}
  .btn.gold{background:linear-gradient(180deg,#e0b23a,#b8860b);color:#3a2a00;}
  .btn.purple{background:linear-gradient(180deg,#8a4fd8,#5f2ea0);}
  .empty{color:#7fae7f;font-size:13px;padding:6px 0;}
  .muted{color:#8ba3c9;font-size:12px;}
  .note{font-size:11.5px;color:#cbd8ee;background:#0f2340;border:1px solid #2a4a7a;border-radius:9px;padding:9px 11px;margin-bottom:12px;line-height:1.5;}

  .mem .m-name{flex:1;min-width:150px;}
  .mem .m-name b{color:#fff;}
  .mem .m-sub{font-size:11px;color:#8ba3c9;margin-top:1px;}
  .pill{display:inline-block;font-size:10px;font-weight:bold;border-radius:9px;padding:1px 7px;margin-left:5px;}
  .pill.ver{background:#3a2f0a;color:var(--gold);}
  .pill.on{background:#0e3a20;color:#4fe08a;}
  .pill.ban{background:#3a1010;color:#ff8a7a;}
  .pill.mute{background:#2a1c3a;color:#c9a0ff;}
  .inp{width:100%;padding:10px 12px;border-radius:9px;border:1px solid #2c4a7a;background:#0f2340;color:#fff;font-size:13px;font-family:inherit;margin-bottom:8px;}

  select.inp{cursor:pointer;}
  .hint{font-size:11px;color:#8ba3c9;margin:-2px 0 12px;}
  .wfull{width:100%;}
  .msrch{width:100%;padding:10px 12px;border-radius:9px;border:1px solid #2c4a7a;background:#0f2340;color:#fff;font-size:14px;margin-bottom:10px;}
  .conv{cursor:pointer;padding:10px;border:1px solid #23406e;border-radius:9px;margin-bottom:7px;background:#0f2340;}
  .conv:hover{background:#12294a;}
  .conv .c-top{font-weight:bold;color:#cfe0f6;font-size:13px;}
  .conv .c-last{font-size:12px;color:#8ba3c9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
  .dmmsg{margin:5px 0;padding:8px 11px;background:#12294a;border-radius:10px;font-size:12.5px;line-height:1.45;}
  .dmmsg b{color:#9fd0ff;}
  .dmmsg .t{color:#7f9bc4;font-size:10px;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0f2340;border:1px solid #2e5290;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .2s;z-index:60;max-width:90vw;}
  .mdl-back{position:fixed;inset:0;background:rgba(4,10,24,.72);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto;}
  .mdl-back.show{display:flex;}
  .mdl{background:#0c1836;border:1.5px solid #2f5aa0;border-radius:14px;padding:18px;max-width:460px;width:100%;box-shadow:0 18px 60px rgba(0,0,0,.6);}

  .mdl .mdl-opt .mo-d{font-size:11.5px;color:#8fa8cf;}
  .mdl .mdl-opt.danger{border-color:#7a3020;background:rgba(160,50,30,.12);}
  .mdl .mdl-badges{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 12px;}
  .mdl .mb-chip{background:#183a6e;border:1px solid #3f7ad0;border-radius:12px;padding:4px 9px;font-size:12px;color:#cfe2ff;display:inline-flex;align-items:center;gap:8px;}

  .mdl .mdl-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
  .toast.show{opacity:1;}
  .loading{padding:24px;text-align:center;color:#9db4d6;}

  .tk-presets{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 8px}
  .tk-plabel{font-size:12px;color:#8fb0c9;margin-right:2px}
  .btn.tkp{font-size:12px;padding:5px 10px;background:#1a3242;color:#dceaf5;border:1px solid #2b5c7d}
  .tk-sug{background:#12324a;border:1px solid #235f88;border-radius:9px;padding:8px 11px;margin:6px 0;font-size:13px;color:#d3e8f6}
  .tk-sug .btn{margin-left:8px}
  .tk-status{margin-top:8px;font-size:13px;line-height:1.45}
  .tk-status:empty{display:none}
  .sup-pri{display:flex;gap:12px;margin:2px 0 12px;font-weight:800}.sup-p0{color:#ff6b6b}.sup-p1{color:#ffb14d}
  .sup-catgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
  .sup-card{background:#152a4a;border:1px solid #24406e;border-radius:14px;padding:16px 10px;cursor:pointer;text-align:center}
  .sup-card:active{filter:brightness(1.18)}.sc-ic{font-size:26px}.sc-lb{font-weight:800;margin:4px 0 2px}.sc-n{color:#9db4d6;font-size:13px}
  .sup-listhdr{display:flex;align-items:center;gap:10px;margin:4px 0 10px;flex-wrap:wrap}.sup-back{color:#7fd0ff;cursor:pointer;font-weight:700}
  .sup-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .sup-tools select,.sup-set select{background:#0f1f38;color:#e8eef7;border:1px solid #2c4a72;border-radius:8px;padding:4px 6px}
  .sup-batch{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#122540;border:1px solid #2c4a72;border-radius:10px;padding:8px;margin-bottom:10px}
  .sup-rowtop{display:flex;align-items:center;gap:8px;margin-bottom:4px}.sup-ck{width:18px;height:18px}
  .sup-pill{font-size:11px;font-weight:800;padding:2px 8px;border-radius:9px;background:#1b3556;color:#cfe0f4}
  .sup-pri-P0{background:#5a1b1b;color:#ffb4b4}.sup-pri-P1{background:#5a3a1b;color:#ffd9a8}.sup-pri-P2{background:#4a441b;color:#f0e6a8}.sup-pri-P3{background:#1b4a2e;color:#a8f0c4}
  .sup-set{font-size:12px;color:#9db4d6;margin:6px 0}.sup-set select{margin:0 4px}
  .mem-tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .mem-loading{color:#9db4d6;padding:16px;text-align:center;font-size:13px}
  .mem-pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;flex-wrap:wrap}
  .mem-pageno{color:#cbd8ee;font-size:13px;font-weight:700}
  .btn[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none}
  .tk-ok{color:#57d98a}
  .tk-fail{color:#ff8f8f}
  .tk-warn{color:#ffcf6b}
  .tk-muted{color:#8fb0c9}
</style>
</head>
<body>

<!-- ===== LOGIN GATE ===== -->
<div id="gate">
  <div class="gatebox">
    <h1>👑 TheFlap Admin</h1>
    <div class="sub">Private moderation console. Sign in with the admin account.</div>
    <label for="aName">Admin name</label>
    <input type="text" id="aName" autocomplete="username" placeholder="admin account name" autocapitalize="off" spellcheck="false">
    <label for="aPass">Password</label>
    <input type="password" id="aPass" autocomplete="current-password" placeholder="password">
    <button id="loginBtn" type="button">Sign in</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<!-- ===== ADMIN APP ===== -->
<div id="app">
  <header class="topbar">
    <span class="crown">👑</span>
    <h1>TheFlap HQ</h1>
    <span class="who" id="whoLabel"></span>
    <button type="button" class="hbtn" id="reloadAll">↻ Refresh</button>
    <button type="button" class="hbtn" id="logoutBtn">Sign out</button>
  </header>
  <div class="statstrip" id="statStrip"></div>
  <nav class="tabs" id="tabNav"></nav>
  <div class="wrap" id="panel"><div class="loading">Loading your HQ…</div></div>
</div>

<div class="toast" id="toast"></div>
<div class="mdl-back" id="mdlBack"><div class="mdl" id="mdlBox"></div></div>

  /* ---------- auth ---------- */
  async function doLogin(){
    var name=$('aName').value.trim(), pass=$('aPass').value, err=$('gateErr');
    err.textContent='';
    if(!name||!pass){err.textContent='Enter the admin name and password.';return;}
    err.textContent='checking…';
    try{
      var hash=await sha256('flapsalt:'+name.toLowerCase()+':'+pass);
      if(name.toLowerCase()!==ADMIN_ACCOUNT){
        var sres=await sb.from('flap_admins').select('name,pass_hash,sections').ilike('name',name).maybeSingle();
        if(sres.error)throw sres.error;
        if(!sres.data){err.textContent='No such account.';return;}
        if(sres.data.pass_hash!==hash){err.textContent='Wrong password.';return;}
        ADMIN_NAME=sres.data.name; ROLE='staff';
        var _s=sres.data.sections; if(typeof _s==='string'){try{_s=JSON.parse(_s);}catch(e){_s=String(_s).split(/[, ]+/).filter(Boolean);}}
        SECTIONS=Array.isArray(_s)?_s:['support','moderation'];
        enterApp(); return;
      }
      var res=await sb.from('flap_users').select('name,pass_hash,banned').ilike('name',name).maybeSingle();
      if(res.error)throw res.error;
      if(!res.data){err.textContent='No such account.';return;}
      if(res.data.pass_hash!==hash){err.textContent='Wrong password.';return;}
      if((res.data.name||'').toLowerCase()!==ADMIN_ACCOUNT){err.textContent='That account is not an administrator.';return;}
      ADMIN_NAME=res.data.name; ROLE='owner'; SECTIONS=['*'];window.__ADMINPW=pass;try{sessionStorage.setItem('flap_modpw',pass);}catch(e){}
      enterApp();
    }catch(e){err.textContent='Could not reach the server — try again.';}
  }

  function stats(){

    return {
      members:realMemberCount(d.us),
      online:d.us.filter(function(u){return u.last_seen&&now-T(u.last_seen)<12e4;}).length,
      joinsToday:d.us.filter(function(u){return T(u.created_at)>dayAgo;}).length,
      joinsWeek:d.us.filter(function(u){return T(u.created_at)>weekAgo;}).length,
      flapsToday:real.filter(function(r){return T(r.created_at)>dayAgo;}).length,
      repliesToday:d.repliesRecent.filter(function(r){return r.created_at&&T(r.created_at)>dayAgo;}).length,
      totalFlaps:real.length, totalReplies:d.replyCount,

      muted:d.us.filter(function(u){return u.muted_until&&new Date(u.muted_until)>new Date();}).length,

  /* ---------- SUPPORT ---------- */
  /* ---- Support quick-reply presets + suggestion engine (Build 10) ---- */
  var PRESETS={
    login:{label:'📱 Login Issue', text:"No worries! We're on it. Try logging back in, and if you're still having trouble, let us know and we'll get you taken care of."},
    bug:{label:'🐛 Bug Report', text:"Thanks for letting us know! We appreciate you catching that. We've sent this over to the team so we can look into it."},
    resolved:{label:'✅ Issue Resolved', text:"You're all good! We took care of the issue. Thanks for your patience while we got everything sorted out."}
  };
  var PRESET_ORDER=['login','bug','resolved'];
  function suggestPreset(msg){
    var t=(msg||'').toLowerCase();
    if(/forgot|reset|password|pass ?word|can.?t remember|locked out/.test(t))return 'forgot';
    if(/log ?in|sign ?in|can.?t get in|won.?t let me in|logged out/.test(t))return 'login';
    if(/bug|crash|error|broken|glitch|not working|does ?n.?t work|freez/.test(t))return 'bug';
    return '';
  }
  function tkSug(tk,msg,whoSafe){
    var sug=suggestPreset(msg);
    if(sug==='forgot')return '<div class="tk-sug">💡 Looks like a <b>password</b> issue — <button class="btn" style="background:linear-gradient(180deg,#c0632a,#8a3f12)" onclick="ADMIN.forgotPassword('+tk.id+',\''+whoSafe+'\')">🔑 Draft a reset</button></div>';
    if(sug)return '<div class="tk-sug">💡 Suggested reply: <b>'+PRESETS[sug].label+'</b> <button class="btn green" onclick="ADMIN.preset('+tk.id+',\''+sug+'\')">Use suggested response</button></div>';
    return '';
  }
  var SUP_CATS=[{k:'login',ic:'🔐',label:'Login Issues'},{k:'bug',ic:'🐛',label:'Bug Reports'},{k:'feature',ic:'💡',label:'Feature Requests'},{k:'account',ic:'🚨',label:'Account / Safety'},{k:'other',ic:'📦',label:'Other'}];
  function tkDeriveCat(m){m=(m||'').toLowerCase();
    if(/(log ?in|sign ?in|password|pass ?word|forgot|reset|locked out|can.?t get in|can.?t log|verification code)/.test(m))return 'login';
    if(/(ban|banned|suspend|report|harass|bully|threat|hack|stolen|impersonat|underage|minor|safety|abuse|delete my account|inappropriate|creep|stalk)/.test(m))return 'account';
    if(/(bug|crash|error|broken|glitch|not working|does ?n.?t work|freez|lag|won.?t load|blank screen|white screen)/.test(m))return 'bug';
    if(/(feature|request|suggestion|idea|please add|would be (nice|cool|great)|wish|could you add|add a )/.test(m))return 'feature';
    return 'other';}
  function tkParse(tk){var parts=String(tk.body||'').split(PSEP);var who=parts[0]||'?';var raw=parts.length>=3?(parts[1]||''):'';var msg=parts.length>=3?parts.slice(2).join(PSEP):(parts[1]||'');
    var meta={st:'new',cat:'',pri:'P2',lr:'',ra:''};
    if(raw&&raw.indexOf('=')>=0){raw.split('|').forEach(function(kv){var i=kv.indexOf('=');if(i>0){var k=kv.slice(0,i),v=kv.slice(i+1);if(k==='st')meta.st=v;else if(k==='cat')meta.cat=v;else if(k==='pri')meta.pri=v;else if(k==='lr')meta.lr=v;else if(k==='ra')meta.ra=v;}});}
    if(!meta.cat)meta.cat=tkDeriveCat(msg);
    if(!/^P[0-3]$/.test(meta.pri))meta.pri='P2';
    if(['new','waiting','userreplied','resolved'].indexOf(meta.st)<0)meta.st='new';
    return {id:tk.id,who:who,msg:msg,meta:meta,created:tk.created_at};}
  function tkMetaStr(m){return 'st='+m.st+'|cat='+m.cat+'|pri='+m.pri+'|lr='+(m.lr||'')+'|ra='+(m.ra||'');}

    _broadcastTargets:async function(target){
      var out={bell:[],pushNames:[]};
      var subs=[]; try{ subs=(await sb.from('push_subs').select('name,p256dh').limit(5000)).data||[]; }catch(e){}
      function uniq(a){var s={},r=[];a.forEach(function(n){var k=(n||'').toLowerCase();if(n&&!s[k]){s[k]=1;r.push(n);}});return r;}
      if(target==='test'){ out.bell=['lock']; out.pushNames=uniq(subs.filter(function(s){return (s.name||'').toLowerCase()==='lock';}).map(function(s){return s.name;})); if(!out.pushNames.length)out.pushNames=['lock']; return out; }
      if(target==='ios'){ var ni=uniq(subs.filter(function(s){return s.p256dh==='ios';}).map(function(s){return s.name;})); out.bell=ni; out.pushNames=ni; return out; }
      if(target==='android'){ var na=uniq(subs.filter(function(s){return s.p256dh==='android';}).map(function(s){return s.name;})); out.bell=na; out.pushNames=na; return out; }
      out.bell=(DATA.us||[]).filter(function(u){return isRealMember(u&&u.name);}).map(function(u){return u.name;});
      out.pushNames=uniq(subs.map(function(s){return s.name;}));
      return out;
    },
    broadcastPreview:async function(){
      var title=(($('bcTitle')&&$('bcTitle').value)||'').trim();

      var tl={all:'Everyone (all members)',ios:'iPhone users',android:'Android users',test:'Just you (lock) — test'}[target];
      var h='<h3 style="margin:0 0 8px">📣 Confirm broadcast</h3>';
      h+='<div class="note"><b>'+esc(title||'(no title)')+'</b><br>'+esc(body)+'</div>';
      h+='<div class="hint">Target: <b>'+esc(tl)+'</b><br>🔔 Bell notification → <b>'+fmtN(info.bell.length)+'</b> member'+(info.bell.length===1?'':'s')+'<br>📱 Phone push → <b>'+fmtN(info.pushNames.length)+'</b> device-registered member'+(info.pushNames.length===1?'':'s')+'</div>';
      h+='<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn" style="background:#1f8f4d" onclick="ADMIN.broadcastSend()">Send now →</button></div>';

    },
    broadcastSend:async function(){
      closeModal();
      var bc=window.__bc||{}; var title=bc.title||'', body=bc.body||'', target=bc.target||'all', info=bc.info;
      if(!info){ info=await ADMIN._broadcastTargets(target); }
      if(!body){ toast('No message.'); return; }
      toast('📣 Sending…');
      var rows=info.bell.map(function(nm){ return {recipient:nm, actor:'📣 '+(title||'TheFlap'), kind:'announce', flap_id:null, excerpt:body.slice(0,200)}; });
      var bellOk=0;
      try{ for(var i=0;i<rows.length;i+=500){ var chunk=rows.slice(i,i+500); var r=await sb.from('flap_notifs').insert(chunk); if(!r||!r.error)bellOk+=chunk.length; } }catch(e){}
      var pushOk=0;
      for(var j=0;j<info.pushNames.length;j++){
        try{ await fetch(SUPABASE_URL+'/functions/v1/send-push',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_ANON_KEY,'apikey':SUPABASE_ANON_KEY},body:JSON.stringify({recipient:info.pushNames[j],title:title||'TheFlap 🐦',body:body})}); pushOk++; }catch(e){}
        if(j%10===9) await new Promise(function(rs){setTimeout(rs,120);});
      }
      try{ await sb.from('flaps').insert({name:'::broadcast::', body:JSON.stringify({title:title,body:body,target:target,bell:bellOk,push:pushOk,ts:new Date().toISOString(),by:(ADMIN_ACCOUNT||'admin')})}); }catch(e){}
      try{ adminLog('(broadcast)','Broadcast "'+(title||body.slice(0,40))+'" → '+target+' (bell '+bellOk+', push '+pushOk+')'); }catch(e){}
      toast('📣 Sent — 🔔 '+bellOk+' · 📱 '+pushOk+'.');
      window.__bc=null;
      try{ ADMIN.loadBroadcastLog(); }catch(e){}
    },
    loadBroadcastLog:async function(){
      var el=$('bcLog'); if(!el)return;
      try{
        var r=await sb.from('flaps').select('body,id').eq('name','::broadcast::').order('id',{ascending:false}).limit(8);

        if(!rows.length){ el.innerHTML='No broadcasts sent yet.'; return; }

      }catch(e){ el.innerHTML='(could not load log)'; }
    },

    },
    revokeBadge:async function(id,m){
      var grants=DATA.badgeGrants||{}; if(grants[m]){ grants[m]=grants[m].filter(function(x){return x!==id;}); if(!grants[m].length)delete grants[m]; }
      await setSen('::badgegrants::', JSON.stringify(grants));
      toast('Revoked from '+m+'.'); loadAll();
    },
    manageBadges:function(name){
      var lc=(name||'').toLowerCase().replace(/^@/,''); var d=DATA||{};
      var defs=d.badgeDefs||[], grants=d.badgeGrants||{}, mine=(grants[lc]||[]);
      var chips=mine.length?mine.map(function(id){
        var b=defs.filter(function(x){return x.id===id;})[0]||{name:id,ic:'🏷'};
        return '<span class="mb-chip">'+esc(b.ic||'🏷')+' '+esc(b.name||id)+(b.drop?' 🎁':'')+'<button onclick="ADMIN.doRevoke(\''+esq(name)+'\',\''+id+'\')">Revoke</button></span>';
      }).join(''):'<span class="muted">No badges or claimed drops.</span>';
      var h='<h3>🏅 Badges — '+esc(name)+'</h3>';
      h+='<div class="mdl-sub">Revoke any granted badge or claimed drop. Removing a claimed drop frees its slot back into the pool automatically.</div>';
      h+='<div class="mdl-badges">'+chips+'</div>';
      h+='<div class="mdl-foot">'+(mine.length?'<button class="btn del" onclick="ADMIN.doRevoke(\''+esq(name)+'\',\'*\')">Revoke all</button>':'')+'<button class="btn" onclick="closeModal()">Close</button></div>';
      openModal(h);
    },
    doRevoke:async function(name,id){
      var lc=(name||'').toLowerCase().replace(/^@/,'');
      var grants=DATA.badgeGrants||{};
      if(grants[lc]){ grants[lc]= (id==='*')?[] : grants[lc].filter(function(x){return x!==id;}); if(!grants[lc].length)delete grants[lc]; }
      await setSen('::badgegrants::', JSON.stringify(grants));
      await adminLog(name, id==='*'?'Revoked all badges/drops':'Revoked badge '+id+' (drop slot reopened if applicable)');
      toast(id==='*'?('Cleared all badges for '+name+'.'):('Revoked from '+name+' — slot reopened if it was a drop.'));
      await loadAll(); ADMIN.manageBadges(name);
    },
    resetAccount:function(name){ if(!isOwner()){toast('Owner only.');return;}
      var h='<h3>♻ Reset account — '+esc(name)+'</h3>';
      h+='<div class="mdl-sub">Pick what to reset. Nothing happens until you confirm.</div>';
      h+='<label class="mdl-opt"><input type="checkbox" id="ra_prof" checked><span><span class="mo-t">Clear profile customization</span><br><span class="mo-d">Banner, bio, and links back to default.</span></span></label>';
      h+='<label class="mdl-opt"><input type="checkbox" id="ra_badges"><span><span class="mo-t">Wipe badges</span><br><span class="mo-d">Removes all granted badges &amp; claimed drops (drop slots reopen).</span></span></label>';
      h+='<label class="mdl-opt"><input type="checkbox" id="ra_photo"><span><span class="mo-t">Clear profile photo</span><br><span class="mo-d">Removes their avatar; falls back to initials.</span></span></label>';
      h+='<label class="mdl-opt danger"><input type="checkbox" id="ra_posts"><span><span class="mo-t">Also delete posts &amp; replies</span><br><span class="mo-d">Permanently removes every flap and reply. Cannot be undone.</span></span></label>';
      h+='<label class="mdl-opt danger"><input type="checkbox" id="ra_full" onchange="ADMIN.raFull(this.checked)"><span><span class="mo-t">FULL reset</span><br><span class="mo-d">Ticks everything above.</span></span></label>';
      h+='<div class="mdl-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn del" onclick="ADMIN.doResetAccount(\''+esq(name)+'\')">Reset account</button></div>';
      openModal(h);
    },
    raFull:function(on){['ra_prof','ra_badges','ra_photo','ra_posts'].forEach(function(id){var el=$(id);if(el)el.checked=on;});},
    doResetAccount:async function(name){
      if((name||'').toLowerCase()===ADMIN_ACCOUNT){toast("Can't reset the admin account.");return;}
      var prof=$('ra_prof')&&$('ra_prof').checked, badges=$('ra_badges')&&$('ra_badges').checked, photo=$('ra_photo')&&$('ra_photo').checked, posts=$('ra_posts')&&$('ra_posts').checked;
      if(!prof&&!badges&&!photo&&!posts){toast('Pick at least one thing to reset.');return;}
      var parts=[]; if(prof)parts.push('profile customization (banner/bio/links)'); if(photo)parts.push('profile photo'); if(badges)parts.push('all badges & claimed drops'); if(posts)parts.push('ALL posts & replies (permanent)');
      if(!confirm('Reset '+name+'?\n\nThis will clear:\n• '+parts.join('\n• ')+'\n\nContinue?'))return;
      try{
        var upd={};
        if(prof){upd.bio=null; upd.links=null; upd.banner='cosmic';}
        if(photo){upd.avatar_url=null;}
        if(Object.keys(upd).length){ var u1=await sb.from('flap_users').update(upd).ilike('name',name); if(u1&&u1.error)throw u1.error; }
        if(badges){ var lc=(name||'').toLowerCase().replace(/^@/,''); var g=DATA.badgeGrants||{}; if(g[lc]){ delete g[lc]; await setSen('::badgegrants::', JSON.stringify(g)); } }
        if(posts){ await sb.from('flaps').delete().ilike('name',name); await sb.from('flap_replies').delete().ilike('name',name); }
        await adminLog(name,'Reset account — cleared: '+parts.join(', '));
        closeModal(); toast('♻ Reset '+name+' — '+parts.length+' item(s) cleared.'); await loadAll();
      }catch(e){ toast('Reset failed — try again.'); }
    },
    toggleSocial:async function(on){await setSen('::features::',on?'on':'off');toast(on?'🚀 Friends & Messaging is LIVE.':'Friends & Messaging turned off.');loadAll();},
    seedRandom:async function(){var p=HOUSE_PERSONAS[Math.floor(Math.random()*HOUSE_PERSONAS.length)];var body=p.posts[Math.floor(Math.random()*p.posts.length)];await postAsPersonaBody(p,body);toast('🌱 Seeded a flap as '+p.name+'.');loadAll();},
    postAs:async function(){
      var sel=$('cPersona'),ta=$('cSeedText'); if(!sel||!ta)return;
      var p=HOUSE_PERSONAS[parseInt(sel.value,10)||0]; var body=(ta.value||'').trim();
      if(!body){toast('Type something to post first.');return;}
      ta.value=''; await postAsPersonaBody(p,body); toast('Posted as '+p.name+'!');loadAll();
    }
  };
  window.ADMIN=ADMIN;

  /* ---------- wire up ---------- */
  $('loginBtn').addEventListener('click',doLogin);
  $('aPass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
  $('aName').addEventListener('keydown',function(e){if(e.key==='Enter')$('aPass').focus();});
  $('logoutBtn').addEventListener('click',logout);
  $('reloadAll').addEventListener('click',function(){loadAll();});
  /* no session persistence — the admin password is required on every visit */
})();
</script>
</body>
</html>
