<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TheFlap — Build 10 Preview</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:Verdana,Arial,sans-serif;}
  body{background:radial-gradient(circle at 50% 0%,#1a2a5c,#0d1428 70%);color:#eaf2ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
  .bar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:6px;background:#16224a;padding:6px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.5);}
  .bar button{border:none;border-radius:9px;padding:9px 16px;font-weight:bold;font-size:13px;cursor:pointer;background:#26355f;color:#cdd8f5;transition:background .15s;}
  .bar button.on{background:#3b82f6;color:#fff;}
  .stage{margin-top:70px;width:100%;display:flex;justify-content:center;align-items:flex-start;padding:0 12px 24px;}
  .phone{width:390px;max-width:100%;height:844px;max-height:calc(100vh - 96px);border:11px solid #0b0e16;border-radius:46px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.65);background:#000;position:relative;}
  .phone:before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#0b0e16;border-radius:0 0 16px 16px;z-index:2;}
  .phone iframe{width:100%;height:100%;border:0;display:block;}
  .desk{width:100%;max-width:1180px;height:calc(100vh - 96px);border-radius:12px;overflow:hidden;box-shadow:0 16px 50px rgba(0,0,0,.5);}
  .desk iframe{width:100%;height:100%;border:0;display:block;}
  .hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:#8ea3cc;pointer-events:none;}
</style>
</head>
<body>
  <div class="bar">
    <button id="bApp" class="on" onclick="setView('app')">📱 App view</button>
    <button id="bDesk" onclick="setView('desktop')">🖥️ Desktop view</button>
  </div>
  <div class="stage" id="stage"></div>
  <div class="hint">TheFlap · build 10 preview — App view shows the iOS/phone look.</div>
<script>
  var APP='stable-app.html';
  function isRealPhone(){ return window.innerWidth <= 820 && window.innerWidth < window.innerHeight; }
  function setView(v){
    var st=document.getElementById('stage');
    document.getElementById('bApp').classList.toggle('on', v==='app');
    document.getElementById('bDesk').classList.toggle('on', v==='desktop');
    if(v==='app'){ st.innerHTML='<div class="phone"><iframe src="'+APP+'?app=1" title="App view"></iframe></div>'; }
    else { st.innerHTML='<div class="desk"><iframe src="'+APP+'" title="Desktop view"></iframe></div>'; }
  }
  // On an actual phone, skip the frame and load the app full-screen
  if(isRealPhone()){ location.replace(APP+'?app=1'); }
  else { setView('app'); }
</script>
</body>
</html>
